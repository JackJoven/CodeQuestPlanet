<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>调试侦探社｜学生体验原型</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17212b;
        --muted: #526274;
        --line: #ccd8df;
        --paper: #f4f8f6;
        --panel: #ffffff;
        --panel-soft: #e9f3f0;
        --teal: #0e8878;
        --teal-dark: #075e55;
        --amber: #c87316;
        --amber-soft: #fff2d9;
        --coral: #c94c40;
        --coral-soft: #fff0ed;
        --green: #287a4e;
        --green-soft: #e7f5ec;
        --navy: #24313d;
        --focus: #2f6ed8;
        --radius: 12px;
        --z-sticky: 10;
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; min-height: 100%; }

      body {
        background: var(--paper);
        color: var(--ink);
        font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      }

      button, select, textarea, input { font: inherit; }

      button, select, textarea {
        border: 1px solid var(--line);
        border-radius: 9px;
      }

      button {
        min-height: 44px;
        padding: 10px 15px;
        background: #fff;
        color: var(--ink);
        cursor: pointer;
        font-weight: 800;
      }

      button:hover { border-color: var(--teal); }
      button:active { transform: translateY(1px); }
      button:disabled { cursor: not-allowed; opacity: 0.5; }
      button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid rgba(47, 110, 216, 0.3); outline-offset: 2px; }

      .primary-button { background: var(--teal-dark); border-color: var(--teal-dark); color: #fff; }
      .secondary-button { background: var(--panel-soft); border-color: #a9ccc4; color: var(--teal-dark); }
      .danger-button { background: var(--coral-soft); border-color: #e2a29b; color: #8d2e26; }

      .appbar {
        position: sticky;
        top: 0;
        z-index: var(--z-sticky);
        background: var(--navy);
        color: #f6fbf9;
        border-bottom: 3px solid var(--teal);
      }

      .appbar-inner {
        width: min(1280px, calc(100% - 28px));
        min-height: 66px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }

      .brand { display: flex; align-items: center; gap: 11px; min-width: 210px; }
      .brand-mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--teal); font-weight: 950; }
      .brand small { display: block; color: #a9dcd3; font-size: 12px; }
      .brand strong { display: block; font-size: 15px; }

      .prototype-label { color: #d8e8e4; font-size: 13px; font-weight: 750; }

      .restart-button { min-height: 38px; border-color: rgba(255,255,255,0.28); background: transparent; color: #fff; padding: 7px 11px; }

      .progress-shell { background: #fff; border-bottom: 1px solid var(--line); }
      .progress-track { width: min(1280px, calc(100% - 28px)); margin: 0 auto; display: grid; grid-template-columns: repeat(7, minmax(90px, 1fr)); gap: 4px; padding: 9px 0; overflow-x: auto; }
      .progress-stage { min-width: 90px; padding: 7px 9px; border-radius: 7px; color: var(--muted); font-size: 12px; font-weight: 850; text-align: center; }
      .progress-stage.is-current { background: var(--panel-soft); color: var(--teal-dark); }
      .progress-stage.is-done { background: var(--green-soft); color: var(--green); }

      .page {
        width: min(1180px, calc(100% - 28px));
        margin: 0 auto;
        padding: clamp(24px, 4vw, 46px) 0 64px;
      }

      .screen-enter { animation: screen-enter 180ms ease-out both; }
      @keyframes screen-enter { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

      .hero-layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(310px, 0.85fr); gap: clamp(24px, 5vw, 70px); align-items: center; min-height: 62vh; }
      .hero-copy h1 { margin: 0; max-width: 14ch; font-size: clamp(2.4rem, 6vw, 5.5rem); letter-spacing: -0.035em; line-height: 0.98; text-wrap: balance; }
      .hero-copy > p { max-width: 62ch; margin: 22px 0 0; color: var(--muted); font-size: 1.05rem; line-height: 1.8; text-wrap: pretty; }
      .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
      .hero-note { margin-top: 16px; color: var(--muted); font-size: 13px; }

      .mission-board { position: relative; min-height: 430px; background: var(--navy); color: #fff; border-radius: var(--radius); overflow: hidden; }
      .mission-board::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 72% 22%, rgba(14,136,120,0.42), transparent 36%), radial-gradient(circle at 20% 80%, rgba(216,129,31,0.25), transparent 32%); pointer-events: none; }
      .board-map { position: absolute; inset: 26px; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); gap: 7px; transform: rotate(-3deg); }
      .board-cell { border: 1px solid rgba(255,255,255,0.14); border-radius: 6px; background: rgba(255,255,255,0.035); }
      .board-cell:nth-child(7), .board-cell:nth-child(13), .board-cell:nth-child(19) { background: rgba(14,136,120,0.66); }
      .board-cell:nth-child(9), .board-cell:nth-child(14) { background: rgba(201,76,64,0.66); }
      .board-caption { position: absolute; left: 24px; right: 24px; bottom: 24px; display: flex; align-items: end; justify-content: space-between; gap: 20px; }
      .board-caption strong { max-width: 14ch; font-size: 1.45rem; line-height: 1.2; }
      .board-caption span { padding: 8px 10px; border-radius: 999px; background: #fff; color: var(--navy); font-size: 12px; font-weight: 900; }

      .screen-header { max-width: 760px; margin-bottom: 26px; }
      .screen-header h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.7rem); letter-spacing: -0.03em; line-height: 1.02; text-wrap: balance; }
      .screen-header p { margin: 14px 0 0; color: var(--muted); font-size: 1rem; line-height: 1.75; text-wrap: pretty; }

      .question-list { display: grid; gap: 14px; }
      .question-block { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
      .question-block h2 { margin: 0; font-size: 1.04rem; line-height: 1.55; }
      .choice-list { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 13px; }
      .choice { position: relative; }
      .choice input { position: absolute; opacity: 0; pointer-events: none; }
      .choice span { display: inline-flex; align-items: center; min-height: 44px; padding: 9px 13px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--muted); cursor: pointer; font-weight: 750; }
      .choice input:checked + span { border-color: var(--teal); background: var(--panel-soft); color: var(--teal-dark); box-shadow: inset 0 0 0 1px var(--teal); }
      .choice input:focus-visible + span { outline: 3px solid rgba(47,110,216,0.3); outline-offset: 2px; }

      .form-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
      .feedback { min-height: 24px; margin: 0; color: var(--muted); font-weight: 800; }
      .feedback.is-error { color: #9a3028; }
      .feedback.is-success { color: var(--green); }

      .remediation-layout { display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 28px; align-items: start; }
      .remediation-banner { padding: 22px; border-radius: var(--radius); background: var(--amber-soft); color: #704209; }
      .remediation-banner h2 { margin: 0 0 10px; font-size: 1.35rem; }
      .remediation-banner p { margin: 0; line-height: 1.7; }
      .mini-lessons { display: grid; gap: 12px; }
      .mini-lesson { display: grid; grid-template-columns: 46px 1fr; gap: 12px; align-items: start; padding: 16px 0; border-bottom: 1px solid var(--line); }
      .mini-lesson b { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--navy); color: #fff; }
      .mini-lesson h3 { margin: 0 0 5px; font-size: 1rem; }
      .mini-lesson p { margin: 0; color: var(--muted); line-height: 1.6; }

      .method-strip { display: flex; align-items: stretch; gap: 6px; overflow-x: auto; padding: 4px 0 16px; }
      .method-step { min-width: 130px; flex: 1; padding: 14px 12px; border-top: 3px solid var(--teal); background: #fff; }
      .method-step small { color: var(--teal-dark); font-weight: 900; }
      .method-step strong { display: block; margin-top: 6px; font-size: 0.95rem; }
      .method-arrow { display: grid; place-items: center; color: var(--muted); font-weight: 900; }

      .explanation-layout { display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 24px; align-items: start; }
      .lesson-copy { background: var(--navy); color: #fff; border-radius: var(--radius); padding: 24px; }
      .lesson-copy h2 { margin: 0; font-size: 1.45rem; }
      .lesson-copy p { margin: 12px 0 0; color: #dbe8e5; line-height: 1.75; }
      .lesson-copy ol { margin: 18px 0 0; padding-left: 22px; color: #eef7f5; line-height: 1.9; }
      .demo-panel { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
      .demo-panel h2 { margin: 0 0 6px; }
      .demo-panel > p { color: var(--muted); line-height: 1.65; }
      .mini-code { display: grid; gap: 6px; margin: 16px 0; }
      .mini-code-line { display: grid; grid-template-columns: 28px 1fr; gap: 8px; padding: 9px 10px; border-radius: 7px; background: #f0f4f6; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .mini-code-line.is-suspicious { background: var(--coral-soft); color: #8a3028; }

      .case-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 18px; }
      .case-header h1 { margin: 4px 0 7px; font-size: clamp(1.9rem, 4vw, 3rem); letter-spacing: -0.025em; }
      .case-header p { margin: 0; color: var(--muted); line-height: 1.65; }
      .case-meta { display: flex; flex-wrap: wrap; gap: 7px; }
      .pill { display: inline-flex; align-items: center; min-height: 30px; border-radius: 999px; padding: 5px 10px; background: var(--panel-soft); color: var(--teal-dark); font-size: 12px; font-weight: 900; }
      .pill.is-warning { background: var(--amber-soft); color: #764509; }

      .case-workspace { display: grid; grid-template-columns: minmax(320px, 0.9fr) minmax(390px, 1.1fr); gap: 16px; align-items: start; }
      .world-column, .investigation-column { display: grid; gap: 14px; }
      .world-panel, .code-panel, .notebook-panel, .timeline-panel { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); }
      .panel-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 15px 16px; border-bottom: 1px solid var(--line); }
      .panel-heading h2 { margin: 0; font-size: 1rem; }
      .panel-heading p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

      .world-map { display: grid; gap: 5px; margin: 16px; aspect-ratio: 1.35; }
      .world-cell { position: relative; display: grid; place-items: center; min-width: 0; border: 1px solid #d6e0e5; border-radius: 6px; background: #f8fbfa; color: var(--muted); font-size: 12px; }
      .world-cell.is-wall { background: var(--navy); border-color: var(--navy); color: #fff; }
      .world-cell.is-beacon { background: #dff5e7; border-color: #8fcda6; color: #20623e; font-weight: 850; }
      .world-cell.is-relay { background: #fff0d3; border-color: #dfb76b; color: #80500b; font-weight: 850; }
      .world-cell.is-robot { outline: 3px solid var(--focus); outline-offset: -3px; }
      .robot { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--focus); color: #fff; font-weight: 950; }
      .world-status { display: flex; flex-wrap: wrap; gap: 10px 16px; padding: 0 16px 16px; color: var(--muted); font-size: 13px; font-weight: 750; }

      .program { display: grid; gap: 6px; padding: 14px; }
      .code-line { width: 100%; min-height: 42px; display: grid; grid-template-columns: 28px 1fr auto; gap: 9px; align-items: center; border-color: transparent; background: #f1f5f6; text-align: left; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; }
      .code-line:hover { border-color: var(--teal); }
      .code-line.is-current { background: #e4eefb; border-color: #88abdc; }
      .code-line.is-selected { background: var(--amber-soft); border-color: #d7a64c; }
      .code-line small { color: var(--muted); }
      .run-controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 14px 14px; }

      .notebook-content { padding: 16px; }
      .notebook-step { padding: 14px 0; border-bottom: 1px solid var(--line); }
      .notebook-step:first-child { padding-top: 0; }
      .notebook-step:last-child { border-bottom: 0; padding-bottom: 0; }
      .notebook-step h3 { margin: 0 0 8px; font-size: 0.96rem; }
      .notebook-step p { margin: 0 0 10px; color: var(--muted); line-height: 1.55; font-size: 14px; }
      .root-options { display: flex; flex-wrap: wrap; gap: 7px; }
      .root-option.is-selected { background: var(--panel-soft); border-color: var(--teal); color: var(--teal-dark); }
      .repair-row { display: flex; flex-wrap: wrap; gap: 8px; }
      .repair-row select { min-height: 44px; flex: 1; min-width: 190px; padding: 8px 10px; background: #fff; color: var(--ink); }
      .hint-box { margin-top: 10px; padding: 12px; border-radius: 9px; background: var(--amber-soft); color: #704209; line-height: 1.55; font-size: 14px; }

      .timeline-panel { grid-column: 1 / -1; }
      .timeline-scroll { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
      th { color: var(--muted); font-size: 12px; }
      tr.is-first td { background: var(--coral-soft); }

      .case-feedback { margin-top: 14px; padding: 13px 15px; border-radius: 9px; background: #eef3f5; color: var(--muted); line-height: 1.6; font-weight: 750; }
      .case-feedback.is-error { background: var(--coral-soft); color: #8d3028; }
      .case-feedback.is-success { background: var(--green-soft); color: var(--green); }

      .equivalent-layout { display: grid; grid-template-columns: 0.85fr 1.15fr; gap: 28px; align-items: center; min-height: 58vh; }
      .result-stamp { display: grid; place-items: center; width: 170px; height: 170px; border: 4px solid var(--amber); border-radius: 50%; color: #7b4705; background: var(--amber-soft); text-align: center; transform: rotate(-4deg); }
      .result-stamp strong { display: block; font-size: 1.3rem; }
      .result-stamp small { display: block; margin-top: 5px; }
      .equivalent-copy h1 { margin: 0; font-size: clamp(2rem, 5vw, 4rem); letter-spacing: -0.03em; }
      .equivalent-copy p { max-width: 65ch; color: var(--muted); line-height: 1.8; }

      .summary-layout { display: grid; grid-template-columns: 0.7fr 1.3fr; gap: 24px; align-items: start; }
      .mastery-panel { background: var(--navy); color: #fff; border-radius: var(--radius); padding: 24px; }
      .mastery-panel h1 { margin: 10px 0 12px; font-size: 2.5rem; letter-spacing: -0.03em; }
      .mastery-panel p { color: #d9e7e4; line-height: 1.7; }
      .mastery-panel .pill { background: var(--green-soft); color: var(--green); }
      .method-recap { margin-top: 22px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.18); }
      .method-recap strong { display: block; margin-bottom: 8px; }
      .method-recap p { margin: 0; font-size: 14px; }
      .evidence-sheet { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
      .evidence-sheet h2 { margin: 0; padding: 18px; border-bottom: 1px solid var(--line); }
      .evidence-list { display: grid; }
      .evidence-row { display: grid; grid-template-columns: 1fr 0.65fr 0.75fr 0.65fr; gap: 10px; padding: 13px 18px; border-bottom: 1px solid var(--line); align-items: center; }
      .evidence-row:last-child { border-bottom: 0; }
      .evidence-row small { color: var(--muted); }
      .evidence-row strong { line-height: 1.4; }

      @media (max-width: 900px) {
        .hero-layout, .explanation-layout, .remediation-layout, .case-workspace, .equivalent-layout, .summary-layout { grid-template-columns: 1fr; }
        .hero-layout { min-height: auto; }
        .mission-board { min-height: 330px; }
        .timeline-panel { grid-column: auto; }
      }

      @media (max-width: 620px) {
        .prototype-label { display: none; }
        .brand { min-width: 0; }
        .brand small { display: none; }
        .page { width: min(100% - 18px, 1180px); padding-top: 24px; }
        .appbar-inner, .progress-track { width: min(100% - 18px, 1280px); }
        .hero-copy h1 { font-size: 2.8rem; }
        .choice-list, .form-actions, .hero-actions, .run-controls, .root-options, .repair-row { display: grid; grid-template-columns: 1fr; }
        .choice span { width: 100%; }
        .evidence-row { grid-template-columns: 1fr 1fr; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <header class="appbar">
      <div class="appbar-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">C</span>
          <span><small>CodeQuestPlanet · 第 4 课</small><strong>调试侦探社</strong></span>
        </div>
        <span class="prototype-label">学生体验原型 · 刷新后清空</span>
        <button id="restartLesson" class="restart-button" type="button">重新开始</button>
      </div>
    </header>

    <div class="progress-shell" aria-label="课程进度">
      <div id="progressTrack" class="progress-track"></div>
    </div>

    <main id="app" class="page" aria-live="polite"></main>

    <script>
      (() => {
        const ROOT_LABELS = {
          orientation: "朝向错误",
          timing: "动作时机错误",
          position: "位置错误",
          sequence: "执行顺序错误"
        };

        const DIRS = ["N", "E", "S", "W"];
        const DIR_LABELS = { N: "北 ↑", E: "东 →", S: "南 ↓", W: "西 ←" };

        const CASES = {
          guided: {
            id: "guided",
            title: "错误转向",
            support: "引导案件",
            mission: "维修通道被封锁。找出程序第一次走偏的位置，让探测员抵达绿色信标。",
            width: 5, height: 5, start: { x: 1, y: 3, dir: "E" }, walls: [[2, 4]], beacon: [3, 2], relay: null,
            expected: ["move()", "turnLeft()", "move()", "turnRight()", "move()", "collect()"],
            buggy: ["move()", "turnRight()", "move()", "turnRight()", "move()", "collect()"],
            first: 2, root: "orientation",
            repairs: [["correct", "把第 2 步改为 turnLeft()"], ["last", "修改最后一步"], ["first", "修改第 1 步"]],
            hints: ["先不要看撞墙的位置。比较撞墙之前，探测员的朝向有没有先发生变化。", "重点比较第 1–3 步的朝向记录。", "强提示：第 2 步转错了方向，只修改这一行。"]
          },
          semi: {
            id: "semi",
            title: "过早采集",
            support: "半引导案件",
            mission: "采集指令没有拼错，但程序报告空采集。找出动作发生得太早的那一步。",
            width: 5, height: 4, start: { x: 1, y: 2, dir: "E" }, walls: [], beacon: [3, 2], relay: null,
            expected: ["move()", "move()", "collect()"],
            buggy: ["move()", "collect()", "move()"],
            first: 2, root: "timing",
            repairs: [["correct", "交换第 2、3 步"], ["last", "修改最后一步"], ["first", "修改第 1 步"]],
            hints: ["采集是否发生在信标所在的格子？", "比较第 2 步的预期位置与实际位置。", "强提示：第 2 步应该先移动到信标，再执行采集。"]
          },
          independent: {
            id: "independent",
            title: "多走一步",
            support: "独立案件",
            mission: "探测员经过信标后继续前进，最终没有完成采集。请用日志找出最早的错误。",
            width: 6, height: 4, start: { x: 1, y: 2, dir: "E" }, walls: [], beacon: [3, 2], relay: null,
            expected: ["move()", "move()", "collect()", "turnLeft()"],
            buggy: ["move()", "move()", "move()", "turnLeft()"],
            first: 3, root: "position",
            repairs: [["correct", "把第 3 步改为 collect()"], ["last", "修改最后一步"], ["first", "修改第 1 步"]],
            hints: ["最终空采集只是结果。探测员在哪一步第一次离开了正确路线？", "检查抵达信标后的下一条指令。", "强提示：第 3 步不应该继续 move()。"]
          },
          transferA: {
            id: "transferA",
            title: "错位的交付顺序",
            support: "迁移能力门 A",
            mission: "新地图没有标出可疑代码。找到正确指令被调换的位置，完成采集与上传。",
            width: 5, height: 4, start: { x: 1, y: 2, dir: "E" }, walls: [], beacon: [2, 2], relay: [3, 2],
            expected: ["move()", "collect()", "move()", "upload()"],
            buggy: ["move()", "move()", "collect()", "upload()"],
            first: 2, root: "sequence",
            repairs: [["correct", "交换第 2、3 步"], ["last", "修改最后一步"], ["first", "修改第 1 步"]],

        function initialWorld(definition) {
          return { x: definition.start.x, y: definition.start.y, dir: definition.start.dir, carrying: false, collected: false, uploaded: false, status: "准备", error: "" };

        function applyCommand(definition, source, command) {
          const world = { ...source, error: "", status: "运行中" };
          if (command === "turnLeft()" || command === "turnRight()") {
            const delta = command === "turnLeft()" ? -1 : 1;
            world.dir = DIRS[(DIRS.indexOf(world.dir) + delta + 4) % 4];
            return world;
          }
          if (command === "move()") {
            const [dx, dy] = { N: [0,-1], E: [1,0], S: [0,1], W: [-1,0] }[world.dir];
            const x = world.x + dx;
            const y = world.y + dy;
            const blocked = x < 0 || y < 0 || x >= definition.width || y >= definition.height || definition.walls.some(([wallX, wallY]) => wallX === x && wallY === y);
            if (blocked) return { ...world, status: "失败", error: "撞墙：当前位置不能继续前进" };
            world.x = x; world.y = y;
            return world;
          }
          if (command === "collect()") {
            const onBeacon = world.x === definition.beacon[0] && world.y === definition.beacon[1];
            if (!onBeacon || world.collected) return { ...world, status: "失败", error: "空采集：当前位置没有信标" };
            world.collected = true; world.carrying = true;
            return world;
          }
          if (command === "upload()") {
            const onRelay = definition.relay && world.x === definition.relay[0] && world.y === definition.relay[1];
            if (!onRelay || !world.carrying) return { ...world, status: "失败", error: onRelay ? "上传失败：没有携带信标" : "上传失败：当前位置不是中继站" };
            world.carrying = false; world.uploaded = true; world.status = "成功";
            return world;
          }
          return { ...world, status: "失败", error: "未知指令" };
        }

        function simulate(definition, program, limit = Infinity) {
          let world = initialWorld(definition);
          const trace = [];
          for (let index = 0; index < program.length && index < limit; index += 1) {
            world = applyCommand(definition, world, program[index]);
            trace.push({ step: index + 1, command: program[index], world: { ...world } });
            if (world.status === "失败") break;
          }
          if (trace.length && world.status !== "失败" && world.status !== "成功") {
            const success = definition.relay ? world.uploaded : world.collected;
            world.status = success ? "成功" : "未完成";
            trace[trace.length - 1].world.status = world.status;

          app.innerHTML = `
            <section class="summary-layout screen-enter">
              <aside class="mastery-panel"><span class="pill">能力门已通过</span><h1>已掌握</h1><p>你在陌生任务中没有依赖强提示，找到了程序第一次偏离预期的位置，并用一次局部修改完成验证。</p><div class="method-recap"><strong>你的调试方法</strong><p>预测 → 单步 → 比较 → 第一次偏离 → 根因 → 只改一处 → 重新验证</p></div><div class="form-actions"><button class="restart-button" data-action="restart" type="button">重新体验</button></div></aside>
              <section class="evidence-sheet"><h2>本课学习证据</h2><div class="evidence-list">${state.evidence.map(item=>`<div class="evidence-row"><div><strong>${escapeHtml(item.title)}</strong><br><small>${escapeHtml(item.result)}</small></div><div><small>第一次偏离</small><br><strong>第 ${item.step} 步</strong></div><div><small>根因</small><br><strong>${escapeHtml(ROOT_LABELS[item.root])}</strong></div><div><small>提示</small><br><strong>${item.hints} 级${item.strong?" · 强":""}</strong></div></div>`).join("")}</div></section>
            </section>`;
        }

        function render() {
          renderProgress();
          if (state.screen === "welcome") renderWelcome();
          if (state.screen === "readiness") renderReadiness();
          if (state.screen === "remediation") renderRemediation();
          if (state.screen === "explanation") renderExplanation();
          if (state.screen === "case") renderCase();
          if (state.screen === "equivalent") renderEquivalent();
          if (state.screen === "summary") renderSummary();
        }

        function startCase(caseId) {
          state.currentCaseId = caseId;
          state.currentCase = freshCase(caseId);
          show("case");
        }

        function resetLesson() {
          state.screen = "welcome";
          state.readiness = {};
          state.readinessFeedback = "";
          state.remediationUsed = false;
          state.demo = {};
          state.demoFeedback = "";
          state.currentCaseId = null;
          state.currentCase = null;
          state.evidence = [];
          state.mastery = "learning";
          render();
          window.scrollTo({top:0,behavior:"smooth"});
        }

        function setCaseFeedback(message, type = "") {
          state.currentCase.feedback = message;
          state.currentCase.feedbackType = type;
          render();
        }

        app.addEventListener("change", (event) => {
          const ready = event.target.dataset.ready;
          const demo = event.target.dataset.demo;
          if (ready) state.readiness[ready] = event.target.value;
          if (demo) state.demo[demo] = event.target.value;
          if (event.target.id === "repairChoice" && state.currentCase) state.currentCase.repairChoice = event.target.value;
        });

        app.addEventListener("click", (event) => {
          const action = event.target.closest("[data-action]")?.dataset.action;
          const step = event.target.closest("[data-mark-step]")?.dataset.markStep;
          const prediction = event.target.closest("[data-prediction]")?.dataset.prediction;
          const root = event.target.closest("[data-root]")?.dataset.root;
          const explanation = event.target.closest("[data-explanation]")?.dataset.explanation;

          if (action === "start-readiness") show("readiness");
          if (action === "check-readiness") {
            const complete = readinessQuestions.every(question => state.readiness[question.id]);
            const correct = readinessQuestions.every(question => state.readiness[question.id] === question.correct);
            if (!complete) { state.readinessFeedback = "请完成三个判断。"; render(); return; }
            if (!correct) { state.remediationUsed = true; state.readinessFeedback = ""; show("remediation"); return; }
            state.readinessFeedback = ""; show("explanation");
          }
          if (action === "retry-readiness") { state.readiness = {}; show("readiness"); }
          if (action === "complete-explanation") {
            if (state.demo.first !== "2" || state.demo.rule !== "one") { state.demoFeedback = "再看一次：状态在第 2 步已经改变，修改时一次只动一处。"; render(); return; }
            state.demoFeedback = ""; startCase("guided");
          }
          if (action === "start-equivalent") startCase("transferB");
          if (action === "restart") resetLesson();

          if (state.screen !== "case") return;
          const c = state.currentCase;
          const definition = currentDefinition();

          if (prediction) { c.prediction = prediction; c.predictionSaved = false; c.feedback = "预测已选择。点击“保存运行前预测”后再运行。"; c.feedbackType = ""; render(); return; }
          if (step) { c.selectedStep = Number(step); c.feedback = `已标记第 ${step} 步。接下来判断根因类型。`; c.feedbackType = ""; render(); return; }
          if (root) { c.selectedRoot = root; c.feedback = `根因暂记为“${ROOT_LABELS[root]}”。选择替换指令并验证。`; c.feedbackType = ""; render(); return; }
          if (explanation) { c.explanation = explanation; render(); return; }

          if (action === "save-prediction") {
            if (!c.prediction) { setCaseFeedback("请先在侦探笔记中选择“会成功”或“会失败”。", "error"); return; }
            c.predictionSaved = true;
            setCaseFeedback("运行前预测已保存。你现在可以单步运行或直接运行到停止。", "success");
          }
          if (action === "step-program") {
            if (!c.predictionSaved) { setCaseFeedback("必须先保存运行前预测，才能开始运行。", "error"); return; }
            c.shownSteps = Math.min(c.shownSteps + 1, c.program.length);
            c.latestRun = simulate(definition, c.program, c.shownSteps);
            c.feedback = `已运行到第 ${c.latestRun.trace.length} 步。比较时间线，再决定是否继续。`;
            c.feedbackType = "";
            render();
          }
          if (action === "run-program") {
            if (!c.predictionSaved) { setCaseFeedback("必须先保存运行前预测，才能开始运行。", "error"); return; }
            c.latestRun = simulate(definition, c.program);
            c.shownSteps = c.latestRun.trace.length;
            if (c.repairApplied) c.verifyResult = c.latestRun;
            c.feedback = c.latestRun.world.status === "成功" ? "修改后的程序成功完成任务。请选择一句修改理由。" : `程序停止：${c.latestRun.world.error || c.latestRun.world.status}。现在寻找第一次偏离。`;
            c.feedbackType = c.latestRun.world.status === "成功" ? "success" : "error";
            render();
          }
          if (action === "request-hint") {
            c.hintLevel = Math.min(3, c.hintLevel + 1);
            if (c.hintLevel === 3) c.strongHintUsed = true;
            c.feedback = c.hintLevel === 3 ? "你使用了强提示：本案可以完成，但迁移题需要换一题重新证明掌握。" : "提示已展开。先根据提示重新查看证据。";
            c.feedbackType = c.hintLevel === 3 ? "error" : "";
            render();
          }
          if (action === "apply-repair") {
            if (!c.selectedStep || !c.selectedRoot) { setCaseFeedback("先标记第一次偏离并选择根因。", "error"); return; }
            c.program = [...definition.buggy];
            if (c.repairChoice === "correct") c.program = [...definition.expected];
            if (c.repairChoice === "last") c.program[c.program.length - 1] = "move()";
            if (c.repairChoice === "first") c.program[0] = "turnRight()";
            c.repairApplied = true;
            c.latestRun = null;
            c.verifyResult = null;
            c.shownSteps = 0;
            c.feedback = "已修改一行。现在运行当前程序，验证修改是否真正解决问题。";
            c.feedbackType = "";
            render();
          }
          if (action === "submit-case") {
            const problems = [];
            if (!c.predictionSaved) problems.push("缺少运行前预测");
            if (!c.latestRun && !c.verifyResult) problems.push("还没有运行程序");
            if (c.selectedStep !== definition.first) problems.push("第一次偏离步骤不正确");
            if (c.selectedRoot !== definition.root) problems.push("根因分类不正确");
            if (!c.repairApplied || c.verifyResult?.world.status !== "成功") problems.push("局部修改还没有成功验证");
            if (c.explanation !== "evidence") problems.push("修改理由没有引用第一次偏离证据");
            if (problems.length) { setCaseFeedback(`还不能提交：${problems.join("；")}。你可以重新查看时间线或请求下一层提示。`, "error"); return; }

            state.evidence.push({ title: definition.title, step: c.selectedStep, root: c.selectedRoot, hints: c.hintLevel, strong: c.strongHintUsed, result: c.strongHintUsed ? "已完成" : "独立通过" });
            if (["transferA", "transferB"].includes(definition.id) && c.strongHintUsed) {
              state.mastery = "completed";
              if (definition.id === "transferA") { show("equivalent"); return; }
              setCaseFeedback("这次等价案件也使用了强提示，因此仍只能记为已完成。正式课程需要再分配一个未见过的新版本；本原型在这里停止。", "error");
              return;
            }
            if (["transferA", "transferB"].includes(definition.id)) { state.mastery = "mastered"; show("summary"); return; }
            const nextId = ORDER[ORDER.indexOf(definition.id) + 1];
            startCase(nextId);
          }
        });

        document.getElementById("restartLesson").addEventListener("click", resetLesson);
        render();
      })();
    </script>
  </body>
</html>
